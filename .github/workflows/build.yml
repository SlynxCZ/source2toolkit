name: Continuous Integration

on:
  push:
    tags:
      - '*'
    paths:
      - pushbuild.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-linux:
    name: Build on Linux (clang-18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build inside Docker
        run: |
          docker compose -f docker/docker-compose.yml up --build --abort-on-container-exit

      # Only addons/ ships. Staged into its own directory so the artifact keeps
      # the addons/ prefix -- uploading build/addons directly would root the
      # artifact at its contents and the release tarball would unpack wrong.
      - name: Stage package
        run: |
          mkdir -p package
          cp -r build/addons package/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: source2toolkit-linux
          path: package
          if-no-files-found: error


  build-windows:
    name: Build on Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Windows setup & build
        shell: pwsh
        run: .\scripts\windows-entrypoint.ps1

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse -Force build\addons package\

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: source2toolkit-windows
          path: package
          if-no-files-found: error


  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: source2toolkit-linux
          path: ./artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: source2toolkit-windows
          path: ./artifacts/windows

      - name: Create archives
        run: |
          version="${GITHUB_REF#refs/tags/}"

          tar -czf source2toolkit_${version}-linux.tar.gz \
            -C artifacts/linux .

          tar -czf source2toolkit_${version}-windows.tar.gz \
            -C artifacts/windows .

      - name: Upload release archives
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: source2toolkit_*.tar.gz
          tag: ${{ github.ref }}
          file_glob: true
          release_name: "${{ github.ref_name }}"
