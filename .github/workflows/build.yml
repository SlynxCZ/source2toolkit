name: Continuous Integration

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-linux:
    name: Build on Linux (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build inside Docker
        run: |
          docker compose -f docker/docker-compose.yml up --build --abort-on-container-exit

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: source2toolkit-linux
          path: build


  build-windows:
    name: Build on Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: source2toolkit-windows
          path: build


  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: source2toolkit-linux
          path: ./artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: source2toolkit-windows
          path: ./artifacts/windows

      - name: Create archives
        run: |
          version="${GITHUB_REF#refs/tags/}"

          tar -czf source2toolkit_${version}-linux.tar.gz \
            -C artifacts/linux .

          tar -czf source2toolkit_${version}-windows.tar.gz \
            -C artifacts/windows .

      - name: Upload release archives
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: source2toolkit_*.tar.gz
          tag: ${{ github.ref }}
          file_glob: true
          release_name: "${{ github.ref_name }}"
