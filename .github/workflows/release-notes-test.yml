# Temporary: posts the notes of an existing release to Discord, to test
# RELEASE_WEBHOOK without a rebuild. Removed again right after the test.
name: Release notes test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.0.36

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Post the notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_WEBHOOK: ${{ secrets.RELEASE_WEBHOOK }}
        run: python3 .github/scripts/release_notes.py "${{ inputs.tag }}" --project "Source2Toolkit"
